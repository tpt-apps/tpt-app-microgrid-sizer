[package]
name = "tpt-microgrid-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tpt-microgrid-sizer-pro"
path = "src/main.rs"

[dependencies]
tpt-appfront-webview = { path = "D:/Programming/1PRODUCTION/Open Source/tpt-appfront/crates/tpt-appfront-webview" }
